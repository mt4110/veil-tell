name: Check outbound destinations with veil-tell
description: Compare isolated outbound activity against a reviewed baseline
inputs:
  baseline:
    description: Repository-relative baseline path
    default: .veil-tell/npm.json
  command:
    description: Shell command to run inside isolation
    default: npm ci
  node-version:
    description: Node.js version to install and make available inside isolation
    default: '26.13.0'
  pr-comment:
    description: Post a PR comment when a new destination is found (requires pull-requests write)
    default: 'false'
outputs:
  report:
    description: Path to the JSON report
    value: ${{ steps.check.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Install veil-tell
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Darwin/arm64) platform=macos-arm64 ;;
          Linux/x86_64) platform=linux-x86_64-gnu ;;
          *) echo 'No release binary for this runner.' >&2; exit 125 ;;
        esac
        version=0.5.2
        archive="veil-tell-$version-$platform.tar.gz"
        install_dir="$RUNNER_TEMP/veil-tell"
        mkdir -p "$install_dir/bin"
        cd "$install_dir"
        curl --fail --silent --show-error --location \
          "https://github.com/mt4110/veil-tell/releases/download/v$version/$archive" -o "$archive"
        gh attestation verify "$archive" --repo mt4110/veil-tell \
          --signer-workflow mt4110/veil-tell/.github/workflows/release-build.yml \
          --source-ref "refs/tags/v$version" --deny-self-hosted-runners
        tar -xzf "$archive"
        install -m 755 "veil-tell-$version-$platform/veil-tell" bin/veil-tell
    - name: Compare outbound destinations
      id: check
      shell: bash
      env:
        VEIL_BASELINE: ${{ inputs.baseline }}
        VEIL_COMMAND: ${{ inputs.command }}
        VEIL_PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        state=$(mktemp -d "$RUNNER_TEMP/veil-tell-state.XXXXXX")
        printf 'report=%s/report.json\n' "$state" >> "$GITHUB_OUTPUT"
        if [[ -n "$VEIL_PR_BASE" ]]; then
          export VEIL_TELL_PR_BASE_LOCK_DIR="$state"
          for lockfile in package-lock.json pnpm-lock.yaml yarn.lock bun.lock Cargo.lock; do
            if git cat-file -e "$VEIL_PR_BASE:$lockfile" 2>/dev/null; then
              if ! git show "$VEIL_PR_BASE:$lockfile" > "$state/$lockfile"; then
                printf '' > "$state/$lockfile"
                echo "Lockfile evidence unavailable for $lockfile." >&2
              fi
            fi
          done
          git show "$VEIL_PR_BASE:$VEIL_BASELINE" > "$state/baseline.json" || {
            echo 'Cannot read the baseline from the PR base commit. Check fetch-depth and commit the reviewed baseline first.' >&2
            exit 125
          }
        else
          cp -- "$VEIL_BASELINE" "$state/baseline.json"
        fi
        if [[ "$(uname -s)" == Linux ]]; then
          if [[ ! -x /usr/bin/bwrap ]]; then
            echo 'Install non-setuid bubblewrap at /usr/bin/bwrap on this runner before running veil-tell.' >&2
            exit 125
          fi
          runtime=$(mktemp -d "$PWD/.veil-tell-node.XXXXXX")
          node_bin=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          cp -R "$(dirname "$(dirname "$node_bin")")/." "$runtime"
          export PATH="$runtime/bin:$PATH"
        fi
        status=0
        cli="$RUNNER_TEMP/veil-tell/bin/veil-tell"
        if [[ "$VEIL_COMMAND" =~ ^(npm|pnpm|yarn|bun|cargo)([[:space:]][a-zA-Z0-9_./=:-]+)+$ ]]; then
          read -r -a argv <<< "$VEIL_COMMAND"
          "$cli" ci --baseline "$state/baseline.json" --report "$state/report.json" -- "${argv[@]}" || status=$?
        else
          "$cli" ci --attribute-npm --baseline "$state/baseline.json" \
            --report "$state/report.json" -- /bin/sh -ec "$VEIL_COMMAND" || status=$?
        fi
        if [[ -f "$state/report.json" ]]; then
          python3 "$GITHUB_ACTION_PATH/.github/destination-summary.py" "$state/report.json" >> "$GITHUB_STEP_SUMMARY" ||
            echo 'Could not write the job summary. See the JSON report.' >&2
        fi
        printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Comment on new destinations
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.check.outputs.status == '21' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VEIL_PR_NUMBER: ${{ github.event.pull_request.number }}
        VEIL_REPORT: ${{ steps.check.outputs.report }}
      run: |
        set -euo pipefail
        comment=$(mktemp "$RUNNER_TEMP/veil-tell-comment.XXXXXX")
        python3 "$GITHUB_ACTION_PATH/.github/destination-summary.py" "$VEIL_REPORT" > "$comment"
        gh pr comment "$VEIL_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
