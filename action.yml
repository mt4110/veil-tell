name: Check outbound destinations with veil-tell
description: Compare isolated outbound activity against a reviewed baseline
inputs:
  baseline:
    description: Repository-relative baseline path
    default: .veil-tell/npm.json
  command:
    description: Shell command to run inside isolation
    default: npm ci
  node-version:
    description: Node.js version to install and make available inside isolation
    default: '26.13.0'
  pr-comment:
    description: Post a PR comment when a new destination is found (requires pull-requests write)
    default: 'false'
outputs:
  report:
    description: Path to the JSON report
    value: ${{ steps.check.outputs.report }}
  should-comment:
    description: Whether a new destination notification applies for PR commenting
    value: ${{ steps.check.outputs.should_comment }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Install veil-tell
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Darwin/arm64) platform=macos-arm64 ;;
          Linux/aarch64) platform=linux-aarch64-gnu ;;
          Linux/x86_64) platform=linux-x86_64-gnu ;;
          *) echo 'No release binary for this runner.' >&2; exit 125 ;;
        esac
        version=0.6.0
        archive="veil-tell-$version-$platform.tar.gz"
        install_dir="$RUNNER_TEMP/veil-tell"
        mkdir -p "$install_dir/bin"
        cd "$install_dir"
        curl --fail --silent --show-error --location \
          "https://github.com/mt4110/veil-tell/releases/download/v$version/$archive" -o "$archive"
        gh attestation verify "$archive" --repo mt4110/veil-tell \
          --signer-workflow mt4110/veil-tell/.github/workflows/release-build.yml \
          --source-ref "refs/tags/v$version" --deny-self-hosted-runners
        tar -xzf "$archive"
        install -m 755 "veil-tell-$version-$platform/veil-tell" bin/veil-tell
        if command -v sha256sum >/dev/null 2>&1; then
          bin_sha=$(sha256sum bin/veil-tell | awk '{print $1}')
        else
          bin_sha=$(shasum -a 256 bin/veil-tell | awk '{print $1}')
        fi
        bin_ver=$(bin/veil-tell --version 2>/dev/null || echo "$version")
        action_sha=$(git -C "$GITHUB_ACTION_PATH" rev-parse HEAD 2>/dev/null || echo "${GITHUB_ACTION_REF:-unknown}")
        printf 'binary_version=%s\n' "$bin_ver" >> "$GITHUB_OUTPUT"
        printf 'binary_sha256=%s\n' "$bin_sha" >> "$GITHUB_OUTPUT"
        printf 'action_ref=%s\n' "${GITHUB_ACTION_REF:-unknown}" >> "$GITHUB_OUTPUT"
        printf 'action_sha=%s\n' "$action_sha" >> "$GITHUB_OUTPUT"
    - name: Compare outbound destinations
      id: check
      shell: bash
      env:
        VEIL_BASELINE: ${{ inputs.baseline }}
        VEIL_COMMAND: ${{ inputs.command }}
        VEIL_PR_BASE: ${{ github.event.pull_request.base.sha }}
        VEIL_ACTION_REF: ${{ steps.install.outputs.action_ref }}
        VEIL_ACTION_SHA: ${{ steps.install.outputs.action_sha }}
        VEIL_BINARY_VERSION: ${{ steps.install.outputs.binary_version }}
        VEIL_BINARY_SHA256: ${{ steps.install.outputs.binary_sha256 }}
      run: |
        set -euo pipefail
        state=$(mktemp -d "$RUNNER_TEMP/veil-tell-state.XXXXXX")
        report_path="$state/report.json"
        cli="$RUNNER_TEMP/veil-tell/bin/veil-tell"
        printf 'report=%s\n' "$report_path" >> "$GITHUB_OUTPUT"

        fail_before_run() {
          local message="$1"
          echo "$message" >&2
          "$cli" summary "$report_path" \
            --github-output "$GITHUB_OUTPUT" \
            --missing-reason "$message" >> "$GITHUB_STEP_SUMMARY" || true
          printf 'status=125\n' >> "$GITHUB_OUTPUT"
          exit 125
        }

        if [[ -n "$VEIL_PR_BASE" ]]; then
          export VEIL_TELL_PR_BASE_LOCK_DIR="$state"
          for lockfile in package-lock.json pnpm-lock.yaml yarn.lock bun.lock Cargo.lock; do
            if git cat-file -e "$VEIL_PR_BASE:$lockfile" 2>/dev/null; then
              if ! git show "$VEIL_PR_BASE:$lockfile" > "$state/$lockfile"; then
                printf '' > "$state/$lockfile"
                echo "Lockfile evidence unavailable for $lockfile." >&2
              fi
            fi
          done
          if ! git show "$VEIL_PR_BASE:$VEIL_BASELINE" > "$state/baseline.json"; then
            fail_before_run "Cannot read the baseline ($VEIL_BASELINE) from the PR base commit. Check fetch-depth: 0 and commit the reviewed baseline first."
          fi
        else
          if [[ ! -f "$VEIL_BASELINE" ]]; then
            fail_before_run "Baseline file not found: $VEIL_BASELINE. Record and commit a reviewed baseline first."
          fi
          cp -- "$VEIL_BASELINE" "$state/baseline.json"
        fi
        if [[ "$(uname -s)" == Linux ]]; then
          if [[ ! -x /usr/bin/bwrap ]]; then
            fail_before_run "Unprivileged non-setuid bubblewrap (/usr/bin/bwrap) is not installed on this runner. Ask the runner administrator to install bubblewrap."
          fi
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true >/dev/null 2>&1; then
            fail_before_run "Unprivileged user/network namespaces via /usr/bin/bwrap are unavailable on this runner. Ask the runner administrator to enable unprivileged namespaces."
          fi
          runtime=$(mktemp -d "$PWD/.veil-tell-node.XXXXXX")
          node_bin=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          cp -R "$(dirname "$(dirname "$node_bin")")/." "$runtime"
          export PATH="$runtime/bin:$PATH"
        fi
        status=0
        if [[ "$VEIL_COMMAND" =~ ^(npm|pnpm|yarn|bun|cargo)([[:space:]][a-zA-Z0-9_./=:-]+)+$ ]]; then
          read -r -a argv <<< "$VEIL_COMMAND"
          "$cli" ci --baseline "$state/baseline.json" --report "$report_path" -- "${argv[@]}" || status=$?
        else
          "$cli" ci --attribute-npm --baseline "$state/baseline.json" \
            --report "$report_path" -- /bin/sh -ec "$VEIL_COMMAND" || status=$?
        fi
        "$cli" summary "$report_path" \
          --github-output "$GITHUB_OUTPUT" \
          --missing-reason "veil-tell exited with status $status without writing report.json." \
          >> "$GITHUB_STEP_SUMMARY" ||
          echo 'Could not write the job summary. See the JSON report.' >&2
        printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Comment on new destinations
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.check.outputs.should_comment == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VEIL_PR_NUMBER: ${{ github.event.pull_request.number }}
        VEIL_REPORT: ${{ steps.check.outputs.report }}
      run: |
        set -euo pipefail
        comment=$(mktemp "$RUNNER_TEMP/veil-tell-comment.XXXXXX")
        "$RUNNER_TEMP/veil-tell/bin/veil-tell" summary "$VEIL_REPORT" > "$comment"
        gh pr comment "$VEIL_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
