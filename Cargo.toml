[package]
name = "veil-tell"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22.1"
httparse = "1.10.1"
json5 = "1.3.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.54", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "net"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
