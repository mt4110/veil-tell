[package]
name = "veil-tell"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22.1"
httparse = "1.10.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
tokio = { version = "1.54", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2"
