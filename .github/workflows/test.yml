name: Test veil-tell
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  receivers:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Install Ubuntu bubblewrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ ! -x /usr/bin/bwrap ]]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
      - run: cargo test --locked
      - run: cargo build --locked --bins --examples
      - name: Receiver and npm postinstall tests
        shell: bash
        run: |
          if [[ "$(uname -s)" == Linux ]]; then
            test -x /usr/bin/bwrap
            /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
            VEIL_TELL_TEST_IP=$(ip -4 -o addr show scope global | awk 'NR == 1 {split($4, address, "/"); print address[1]}')
            test -n "$VEIL_TELL_TEST_IP"
            export VEIL_TELL_TEST_IP
          fi
          node_bin=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          target/debug/examples/receivers_suite target/debug/veil-tell target/debug/examples/receiver_cli "$(dirname "$(dirname "$node_bin")")"
          target/debug/examples/agent_env_suite target/debug/examples/receiver_cli "$(dirname "$(dirname "$node_bin")")" --persistent
          target/debug/examples/agent_env_suite target/debug/examples/receiver_cli "$(dirname "$(dirname "$node_bin")")"
      - run: target/debug/examples/verify_suite target/debug/veil-tell target/debug/examples/receiver_cli
      - name: Dependency manager lifecycle fixtures
        shell: bash
        run: |
          runtime=$(mktemp -d)
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64) bun_package=bun-darwin-aarch64; pnpm_package=exe.darwin-arm64 ;;
            Linux/aarch64) bun_package=bun-linux-aarch64; pnpm_package=exe.linux-arm64 ;;
            Linux/x86_64) bun_package=bun-linux-x64; pnpm_package=exe.linux-x64 ;;
            *) exit 1 ;;
          esac
          npm install --prefix "$runtime" --ignore-scripts --no-audit --no-fund --save-exact \
            npm@11.20.0 corepack@0.35.0 pnpm9@npm:pnpm@9.15.9 pnpm10@npm:pnpm@10.34.9 \
            "@pnpm/$pnpm_package@12.21.0" @yarnpkg/cli-dist@4.18.1 \
            yarn-classic@npm:yarn@1.22.22 "@oven/$bun_package@1.4.4"
          mkdir -p "$runtime/bin"
          install -m 755 "$(node -p 'require("node:fs").realpathSync(process.execPath)')" "$runtime/bin/node"
          trials=()
          for entry in \
            "npm npm npm/bin/npm-cli.js" \
            "pnpm9 pnpm pnpm9/bin/pnpm.cjs" \
            "pnpm10 pnpm pnpm10/bin/pnpm.cjs" \
            "pnpm12 pnpm @pnpm/$pnpm_package/pnpm" \
            "berry yarn @yarnpkg/cli-dist/bin/yarn.js" \
            "classic yarn yarn-classic/bin/yarn.js" \
            "bun bun @oven/$bun_package/bin/bun"; do
            read -r variant manager executable <<< "$entry"
            mkdir "$runtime/$variant"
            ln -s "../node_modules/$executable" "$runtime/$variant/$manager"
            ln -s ../bin/node "$runtime/$variant/node"
            trials+=("$manager=$runtime/$variant/$manager")
          done
          target/debug/examples/package_managers_suite target/debug/veil-tell "${trials[@]}" \
            "cargo=$(command -v cargo)" \
            "corepack=$runtime/node_modules/corepack/dist/corepack.js" \
            "node=$runtime/bin/node" "standalone=$runtime/node_modules/@pnpm/$pnpm_package/pnpm"
      - run: target/debug/examples/dns_probe
