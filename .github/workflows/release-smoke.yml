name: Verify released veil-tell v0.4.0 Action on macOS
on:
  push:
    branches: [verify/v0.4.0-action-macos]
permissions:
  contents: read
  attestations: read
jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: unchanged
            expected: 0
            outcome: success
          - case: new
            expected: 21
            outcome: failure
          - case: volume
            expected: 22
            outcome: failure
    name: Action / ${{ matrix.case }}
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare fixture
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .veil-tell
          cat > package.json <<'JSON'
          {"name":"veil-release-smoke","version":"1.0.0","private":true,"scripts":{"postinstall":"python3 -B probe.py"}}
          JSON
          printf 'update-notifier=false\n' > .npmrc
          printf '%s\n' "$CASE" > case.txt
          python3 -B tests/release-smoke.py prepare "$CASE"
          # The production proxy snapshots host interface addresses before npm starts.
          # Install the disposable runner's loopback alias only after that point.
          printf '192.0.1.2 volume.test new.test\n' | sudo tee -a /etc/hosts >/dev/null
          /bin/bash tests/release-smoke-receiver.sh > "$RUNNER_TEMP/receiver.log" 2>&1 &
      - uses: mt4110/veil-tell@v0
        id: veil
        continue-on-error: true
        with:
          command: npm run postinstall
      - name: Check JSON, receiver and job summary
        if: always()
        env:
          CASE: ${{ matrix.case }}
          EXPECTED: ${{ matrix.expected }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          ACTION_OUTCOME: ${{ steps.veil.outcome }}
          REPORT: ${{ steps.veil.outputs.report }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [[ -n "$REPORT" && -f "$REPORT" ]]; then
            cp "$REPORT" "$RUNNER_TEMP/evidence/report.json"
          fi
          touch receiver.stop
          for _ in {1..40}; do
            if grep -q '^connections=' "$RUNNER_TEMP/receiver.log"; then break; fi
            sleep 0.25
          done
          cp "$RUNNER_TEMP/receiver.log" "$RUNNER_TEMP/evidence/receiver.log"
          python3 -B tests/release-smoke.py check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: smoke-${{ matrix.case }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
